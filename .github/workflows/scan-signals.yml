name: 24/7 Crypto Scan

# Crypto markets never close — this cron runs every 15 minutes forever.
# Each run executes the full analysis pipeline and commits new signals
# to bridge/signal_queue.jsonl so the queue is readable from anywhere.
#
# IMPORTANT: this workflow NEVER places real orders. It writes signals.
# An external agent (your Hermes bridge, your laptop, your VPS) decides
# what to do with them.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      symbol:
        description: "Single symbol to scan (optional)"
        required: false
        type: string

concurrency:
  group: scan-signals
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Copy example config if none committed
        run: |
          if [ ! -f config.json ]; then
            cp config.example.json config.json
          fi

      - name: Run scanner (verbose, no error swallow)
        continue-on-error: true
        run: |
          cd tools
          if [ -n "${{ inputs.symbol }}" ]; then
            python3 scanner.py --symbol "${{ inputs.symbol }}"
          else
            python3 scanner.py
          fi

      - name: Pull news (CoinGecko + CoinDesk + Cointelegraph, no key)
        run: cd tools && python3 news.py || true

      - name: Market sentiment
        run: cd tools && python3 sentiment.py || true

      - name: On-chain whale watcher
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: cd tools && python3 onchain.py || true

      - name: Watch alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: cd tools && python3 alerts.py watch || true

      - name: Push new high-quality signals to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: cd tools && python3 push_signals.py --min-quality 0.4 --min-onchain-usd 1000000 || true

      - name: Auto-trader pipeline (scanner → exit → tm → risk → budget → broker)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BROKER_MODE_HINT: paper
        run: python3 bridge/pipeline_once.py --min-quality 0.5 --sims 2000 --max-per-run 3 || true

      - name: Position tracker (checkt offene Trades, pusht Close + PnL)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 bridge/position_tracker.py || true

      - name: Commit new signals + pipeline state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data/snapshots
          if [ -f bridge/signal_queue.jsonl ]; then
            tail -n 500 bridge/signal_queue.jsonl > data/snapshots/latest.jsonl
          fi
          # Commit the snapshot plus the dedup cursors AND the PnL stats (state persists)
          git add data/snapshots/latest.jsonl 2>/dev/null || true
          git add data/snapshots/last_push_ts.txt 2>/dev/null || true
          git add data/snapshots/last_pipeline_ts.txt 2>/dev/null || true
          git add data/snapshots/pnl_stats.json 2>/dev/null || true
          # bridge/auto_trades.jsonl: keep it committed so we can track across runs
          mkdir -p data/snapshots
          if [ -f bridge/auto_trades.jsonl ]; then
            cp bridge/auto_trades.jsonl data/snapshots/auto_trades.jsonl
            git add data/snapshots/auto_trades.jsonl 2>/dev/null || true
          fi
          if ! git diff --staged --quiet; then
            git commit -m "chore: snapshot signals + pipeline cursors $(date -u +%FT%TZ)"
            git push
          fi
